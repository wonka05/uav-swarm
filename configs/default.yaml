environment:
  grid_size: 50
  n_agents: 5
  n_targets: 10
  obs_radius: 5
  comm_radius: 10
  max_battery: 500
  max_steps: 500
  dynamic_target_ratio: 0.33
  sensor_shape: circle          # "circle" (81 cells) | "square" (121) — ablation switch
  coverage_threshold: 0.95

rewards:
  coverage: 0.5
  detection: 1.0
  collision: -1.0
  redundancy: -0.1
  battery_per_step: -0.01
  cooperative_alpha: 0.3

maddpg:
  gamma: 0.99
  tau: 0.01
  lr_actor: 0.00005
  lr_critic: 0.0001
  batch_size: 256
  buffer_capacity: 1000000
  update_frequency: 20
  hidden_actor: 128
  hidden_critic: 256
  noise_start: 0.3
  noise_end: 0.05
  noise_decay: 0.997
  saturation_penalty: 0.01
  saturation_threshold: 3.0

training:
  n_episodes: 1500
  save_frequency: 100
  log_frequency: 50
  eval_frequency: 10
  eval_episodes: 10
  checkpoint_dir: checkpoints/
  log_dir: logs/

evaluation:
  n_test_episodes: 100
  render: false